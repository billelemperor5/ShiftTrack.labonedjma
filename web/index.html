<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Application professionnelle de suivi des horaires, salaires et finances.">
  
  <!-- Theme color for all mobile browsers (white) -->
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ShiftTrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShiftTrack</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #FFFFFF 0%, #F8FAFC 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-logo {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(15, 118, 110, 0.15);
      animation: pulse 2s infinite ease-in-out;
    }
    .splash-spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid rgba(15, 118, 110, 0.12);
      border-radius: 50%;
      border-top-color: #0F766E;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(15, 118, 110, 0.15); }
      50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(15, 118, 110, 0.25); }
    }
  </style>
  <!-- Safe service worker unregistration to avoid stale caching without throwing in file:// or null origins -->
  <script>
    try {
      if (window.isSecureContext || window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        if ('serviceWorker' in navigator && typeof navigator.serviceWorker.getRegistrations === 'function') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().catch(function() {});
            }
          }).catch(function(e) {});
        }
        if ('caches' in window && typeof caches.keys === 'function') {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]).catch(function() {});
            }
          }).catch(function(e) {});
        }
      }
    } catch (e) {
      // Ignored in non-supported / file:// origins
    }
  </script>
</head>
<body>
  <!-- Centered premium loading splash screen -->
  <div id="loading-splash">
    <div class="splash-logo-container">
      <img class="splash-logo" src="icons/Icon-192.png" alt="ShiftTrack Logo" />
    </div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    function removeSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }

    // MutationObserver to hide splash screen once Flutter renders the UI
    var observer = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var m = mutations[i];
        if (m.addedNodes && m.addedNodes.length > 0) {
          for (var j = 0; j < m.addedNodes.length; j++) {
            var node = m.addedNodes[j];
            var name = (node.nodeName || node.tagName || '').toUpperCase();
            if (name === 'FLUTTER-VIEW' || name === 'FLT-GLASS-PANE' || name === 'FLT-SCENE' || name === 'CANVAS') {
              removeSplash();
              observer.disconnect();
              return;
            }
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Guaranteed fallback timer so splash is never stuck
    setTimeout(removeSplash, 1500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
