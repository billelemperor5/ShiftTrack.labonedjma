name: ShiftTrack Firebase Auto-Sync

on:
  schedule:
    # Runs every 10 minutes 24/7 automatically in the cloud
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
  push:
    branches:
      - main

concurrency:
  group: sync-firebase
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ZKBioTime to Firebase Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm install

      - name: Execute Firebase Cloud Sync
        run: |
          cd server
          node sync_to_firebase.js
        env:
          ZKBIO_BASE_URL: 'http://105.96.0.211:8080'
          NODE_ENV: 'production'
